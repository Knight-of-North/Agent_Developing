# H2：测试发现只扫 tests/ 目录。此前根目录的 test_api.py（顶层直接调真实 API
# 的连通性脚本）会被 pytest import 触发真实请求——烧 token 且 CI 必挂。
# 配置 testpaths 后，根目录/ scripts/ 下的 test_*.py 一律不被收集。
[pytest]
testpaths = tests

# 2026-11：把项目根目录加入 sys.path（pytest 7+ 原生支持）。
# 此前 test_logic.py 顶部手工 sys.path.insert，每个新测试文件都要抄一遍；
# 写在这里后，新增测试文件直接 import nodes / rules 即可。
pythonpath = .

# 失败即停的阈值留给 CI 命令行（-x），这里只统一基础行为：
# -ra 汇总跳过/失败原因，--strict-markers 防止拼错 marker 被静默忽略
addopts = -ra --strict-markers
